name: Pet
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.38"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0
schemes:
  Pet:
    build:
      targets:
        Pet: all
        PetTests: [test]
        PetUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Pet.storekit
    test:
      config: Debug
      targets:
        - PetTests
        - PetUITests
      testPlans:
        - path: Pet.xctestplan
          defaultPlan: true
      commandLineArguments:
        "-NoCloudKit": true
        "-UITesting": true
targets:
  Pet:
    type: application
    platform: iOS
    sources:
      - path: Pet
      - path: Shared
      - path: Pet.storekit
        buildPhase: resources
    preBuildScripts:
      - name: Display name from AppConfig
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/display-name.py"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.pet
        INFOPLIST_FILE: Pet/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pet/Pet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  PetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetTests
      - path: Pet.storekit
        buildPhase: resources
    dependencies:
      - target: Pet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.pet.tests
        GENERATE_INFOPLIST_FILE: YES
  PetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PetUITests
      - path: Pet.storekit
        buildPhase: resources
    dependencies:
      - target: Pet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.pet.uitests
        GENERATE_INFOPLIST_FILE: YES
